name: OpenClawMonitor
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  OpenClawMonitor:
    type: application
    platform: iOS
    sources:
      - OpenClawMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "OC Monitor"
    scheme:
      testTargets:
        - OpenClawMonitorTests
        - OpenClawMonitorUITests

  OpenClawMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit, Tests/Integration]
    dependencies:
      - target: OpenClawMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  OpenClawMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: OpenClawMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
